# 托管 next build 的静态导出（out/）。trailingSlash: true，页面均为 <path>/index.html。
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  # 目录补斜杠的 301 用相对地址，避免在 Cloud Run 后面带出 :8080 和 http。
  absolute_redirect off;
  error_page 404 /404.html;
  # 注意：location 内的 add_header 会覆盖 server 级配置，安全头需要在每个 location 中声明。

  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 'ok'; }

  # Next 构建产物带内容 hash，可长期缓存。
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # 页面不缓存，保证发布后立即生效。
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri $uri/ =404;
  }
}
