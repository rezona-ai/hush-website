apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ${SERVICE_NAME}
  labels: {cloud.googleapis.com/location: ${GCP_REGION}}
  annotations:
    hush.rezona.ai/revision: "${REVISION}"
    # 只接受 LB（serverless NEG）进入的流量，对外统一走静态 IP，不暴露 run.app 公网入口。
    # LB 转发的请求不带调用方身份：deploy/setup-lb.sh 一次性授予 allUsers roles/run.invoker。
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
spec:
  template:
    metadata: {annotations: {autoscaling.knative.dev/minScale: "0", autoscaling.knative.dev/maxScale: "${MAX_SCALE}"}}
    spec:
      containerConcurrency: 1000
      containers:
        - image: ${IMAGE}
          ports: [{containerPort: 8080}]
          resources: {limits: {cpu: "1", memory: 256Mi}}
          startupProbe: {httpGet: {path: /healthz, port: 8080}}
